<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldtech Engenharia Elétrica</title>
<meta name="description" content="Projetos elétricos, laudos e regularização. Fale com a Fieldtech Engenharia Elétrica.">
<meta name="theme-color" content="#14202b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  /* ====== PERSONALIZAÇÃO: mude as cores aqui ====== */
  :root{
    --verde:#85bb25;
    --verde-escuro:#6a9a1a;
    --fundo:#14202b;
    --card:#1c2b38;
    --texto:#f2f5f7;
    --texto-suave:#a9b7c2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--fundo);color:var(--texto);
    min-height:100vh;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .pagina{width:100%;max-width:460px;padding:0 20px 40px}

  /* Topo */
  .topo{
    text-align:center;padding:48px 0 28px;position:relative;
  }
  .topo::before{
    content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:280px;height:180px;
    background:radial-gradient(closest-side,rgba(133,187,37,.28),transparent);
    pointer-events:none;
  }
  .logo{display:block;width:260px;max-width:82%;height:auto;margin:0 auto;position:relative}
  .marca{
    font-family:'Bebas Neue',Impact,sans-serif;
    font-size:58px;letter-spacing:3px;line-height:1;position:relative;
  }
  .marca b{color:var(--verde);font-weight:400}
  .sub{
    margin-top:6px;font-size:12px;letter-spacing:5px;text-transform:uppercase;
    color:var(--verde);position:relative;
  }
  .apresentacao{
    margin:22px auto 0;max-width:340px;color:var(--texto-suave);
    font-size:15px;line-height:1.55;position:relative;
  }

  /* Botões */
  .botoes{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .botao{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;border-radius:14px;
    background:var(--card);color:var(--texto);text-decoration:none;
    border:1px solid rgba(255,255,255,.06);
    transition:transform .15s,border-color .15s,background .15s;
    font-size:16px;font-weight:500;
  }
  .botao:hover,.botao:focus-visible{transform:translateY(-2px);border-color:var(--verde);outline:none}
  .botao .icone{
    flex:none;width:42px;height:42px;border-radius:11px;
    display:grid;place-items:center;background:rgba(133,187,37,.14);
  }
  .botao svg{width:22px;height:22px;fill:none;stroke:var(--verde);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .botao small{display:block;font-size:13px;color:var(--texto-suave);font-weight:400;margin-top:2px}
  .botao.principal{background:var(--verde);color:#10200a;border-color:transparent}
  .botao.principal .icone{background:rgba(16,32,10,.14)}
  .botao.principal svg{stroke:#10200a}
  .botao.principal small{color:rgba(16,32,10,.75)}
  .botao.principal:hover{background:var(--verde-escuro);border-color:transparent}
  button.botao{width:100%;font-family:inherit;cursor:pointer;text-align:left}

  /* Serviços */
  h2{
    font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;
    font-size:26px;letter-spacing:2px;margin:38px 0 14px;
    display:flex;align-items:center;gap:10px;
  }
  h2::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
  .servicos{list-style:none;display:grid;gap:10px}
  .servicos li{
    background:var(--card);border-radius:12px;padding:14px 16px;
    border-left:3px solid var(--verde);font-size:15px;line-height:1.4;
  }
  .servicos li span{display:block;color:var(--texto-suave);font-size:13px;margin-top:3px}

  /* Rodapé */
  footer{
    margin-top:40px;text-align:center;color:var(--texto-suave);
    font-size:12.5px;line-height:1.7;
  }
  footer strong{color:var(--texto);font-weight:500}

  /* ====== EFEITOS ====== */
  body{position:relative;overflow-x:hidden;
    background:
      radial-gradient(900px 500px at 50% -120px,rgba(133,187,37,.16),transparent 70%),
      radial-gradient(600px 400px at 100% 100%,rgba(133,187,37,.08),transparent 70%),
      var(--fundo);
    background-attachment:fixed}
  .fundo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .grade{position:absolute;inset:0;
    background-image:linear-gradient(rgba(133,187,37,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(133,187,37,.07) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 12%,#000 20%,transparent 75%);
            mask-image:radial-gradient(ellipse 70% 55% at 50% 12%,#000 20%,transparent 75%);
    animation:grade 14s linear infinite}
  @keyframes grade{to{background-position:0 44px,44px 0}}
  .feixe{position:absolute;left:50%;top:-30vmax;width:120vmax;height:120vmax;margin-left:-60vmax;
    background:conic-gradient(from 0deg,transparent 0 8%,rgba(133,187,37,.10) 11%,transparent 15% 40%,rgba(133,187,37,.07) 43%,transparent 47% 70%,rgba(133,187,37,.09) 73%,transparent 77%);
    -webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);
    animation:gira 40s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  #raios{position:absolute;inset:0;width:100%;height:100%}
  .particula{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;
    background:var(--verde);box-shadow:0 0 8px 2px rgba(133,187,37,.7);opacity:0;
    animation:sobe linear infinite}
  @keyframes sobe{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.5}100%{transform:translateY(-105vh);opacity:0}}
  .pagina{position:relative;z-index:1}
  .logo{animation:brilho 4s ease-in-out infinite}
  @keyframes brilho{0%,100%{filter:drop-shadow(0 0 6px rgba(133,187,37,.25))}50%{filter:drop-shadow(0 0 22px rgba(133,187,37,.65))}}
  .entra{animation:entra .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*110ms + 100ms)}
  @keyframes entra{from{opacity:0;transform:translateY(18px)}}
  .botao{position:relative;overflow:hidden;backdrop-filter:blur(6px)}
  .botao:hover,.botao:focus-visible{box-shadow:0 0 0 1px var(--verde),0 8px 28px -6px rgba(133,187,37,.45)}
  .botao.principal{box-shadow:0 0 24px -4px rgba(133,187,37,.55)}
  .botao.principal::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
    transform:skewX(-20deg);animation:brilhoBtn 3.8s ease-in-out infinite}
  @keyframes brilhoBtn{0%,55%{left:-60%}100%{left:130%}}
  .botao .icone{transition:transform .2s,background .2s}
  .botao:hover .icone{transform:scale(1.1) rotate(-6deg);background:rgba(133,187,37,.28)}
  .apresentacao{background:linear-gradient(90deg,var(--texto-suave) 40%,#fff 50%,var(--texto-suave) 60%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:varre 6s ease-in-out infinite}
  @keyframes varre{0%,30%{background-position:120% 0}100%{background-position:-120% 0}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .entra{opacity:1;transform:none}.particula,#raios{display:none}
    .apresentacao{color:var(--texto-suave);background:none}
  }
</style>
</head>

<script>
  // Efeitos: raios + partículas
  (function(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var fundo=document.querySelector('.fundo');
    for(var i=0;i<16;i++){
      var p=document.createElement('i');p.className='particula';
      p.style.left=(Math.random()*100)+'%';
      p.style.animationDuration=(9+Math.random()*12)+'s';
      p.style.animationDelay=(-Math.random()*20)+'s';
      var s=1+Math.random()*2.5;p.style.width=p.style.height=s+'px';
      fundo.appendChild(p);
    }
    var c=document.getElementById('raios'),x=c.getContext('2d'),W,H,D;
    function tam(){D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
    tam();addEventListener('resize',tam);
    function raio(x1,y1,x2,y2,desv,pts){
      if(desv<2.5){pts.push([x2,y2]);return}
      var mx=(x1+x2)/2+(Math.random()-.5)*desv,my=(y1+y2)/2+(Math.random()-.5)*desv*.5;
      raio(x1,y1,mx,my,desv/2,pts);raio(mx,my,x2,y2,desv/2,pts);
    }
    function novo(){
      var x0=W*(.08+Math.random()*.84),y0=-10,x1=x0+(Math.random()-.5)*W*.35,y1=H*(.3+Math.random()*.45);
      var main=[[x0,y0]];raio(x0,y0,x1,y1,H*.18,main);
      var ramos=[];
      for(var k=0;k<3;k++){
        var a=main[Math.floor(main.length*(.25+Math.random()*.5))];
        var r=[[a[0],a[1]]];
        raio(a[0],a[1],a[0]+(Math.random()-.5)*W*.35,a[1]+H*(.1+Math.random()*.2),H*.1,r);ramos.push(r);
      }
      return {main:main,ramos:ramos,t:0};
    }
    function desenha(pts,w,a){
      x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
      for(var i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);
      x.lineWidth=w;x.strokeStyle='rgba(215,255,150,'+a+')';x.shadowColor='rgba(133,187,37,'+a+')';x.shadowBlur=18;x.stroke();
    }
    var lista=[];
    function proximo(){setTimeout(function(){lista.push(novo());if(Math.random()<.35)setTimeout(function(){lista.push(novo())},150);proximo()},2200+Math.random()*3800)}
    proximo();setTimeout(function(){lista.push(novo())},700);
    function frame(){
      x.clearRect(0,0,W,H);
      for(var i=lista.length-1;i>=0;i--){
        var b=lista[i];b.t+=1;
        var a=Math.max(0,1-b.t/38);
        if(b.t%6<2)a*=.45; // cintilar
        if(b.t>38){lista.splice(i,1);continue}
        if(b.t<3){x.fillStyle='rgba(133,187,37,.07)';x.fillRect(0,0,W,H)}
        desenha(b.main,2.2,a);
        for(var j=0;j<b.ramos.length;j++)desenha(b.ramos[j],1.1,a*.8);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
